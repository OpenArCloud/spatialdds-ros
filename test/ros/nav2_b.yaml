# Robot B's planner and global costmap, for the two-domain acceptance.
#
# The `peers_layer` stanza is the one the README tells an operator to add:
# a dedicated obstacle layer with two observation sources, the peers marking
# and the ring clearing. awareness_range_m (8.0 on robot B) is at or below
# both ranges, which is the rule the node cannot check for itself.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: false
      always_send_full_costmap: true
      transform_tolerance: 1.0
      plugins: ["static_layer", "peers_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      peers_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: peers clearing
        peers:
          topic: /robot_b/peers/cloud
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_max_range: 8.0
          raytrace_max_range: 8.5
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        clearing:
          topic: /robot_b/peers/clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 8.5
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
